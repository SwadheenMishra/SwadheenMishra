<svg xmlns="http://www.w3.org/2000/svg" width="900" height="150" viewBox="0 0 900 150" role="img" aria-label="Terminal saying thanks for stopping by">
  <title>Terminal saying thanks for stopping by</title>
  <defs>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow"><feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#ffffff" opacity="0.025"/>
    </pattern>
    <radialGradient id="vig" cx="50%" cy="45%" r="75%">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.45"/>
    </radialGradient>
    <linearGradient id="namegrad" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#00FF9C"/><stop offset="1" stop-color="#00E5FF"/>
    </linearGradient>
    <clipPath id="win"><rect x="1" y="1" width="898" height="148" rx="12"/></clipPath>
  </defs>
  <style>
    text { font-family: 'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Courier New',monospace; font-size: 15px; }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .flicker { animation: flicker 6s infinite; }
    @keyframes flicker { 0%,92%,100% { opacity: 1; } 93% { opacity: .55; } 94% { opacity: 1; } 96% { opacity: .75; } }
  </style>
  <g clip-path="url(#win)">
    <rect width="900" height="150" fill="#0D1117"/>
    <rect width="900" height="38" fill="#161B22"/>
    <line x1="0" y1="38" x2="900" y2="38" stroke="#30363D"/>
    <circle cx="24" cy="19" r="6.5" fill="#FF5F56"/><circle cx="46" cy="19" r="6.5" fill="#FFBD2E"/><circle cx="68" cy="19" r="6.5" fill="#27C93F"/>
    <text x="450.0" y="24" text-anchor="middle" fill="#8B949E" style="font-size:13px">swadheen@github: ~ — exit</text>
    <text x="28" y="74" xml:space="preserve"><tspan fill="#00FF9C">swadheen@github</tspan><tspan fill="#C9D1D9">:</tspan><tspan fill="#00E5FF">~</tspan><tspan fill="#C9D1D9">$ </tspan></text>

  <clipPath id="f1"><rect x="200.9" y="59" height="21" width="0">
    <animate attributeName="width" values="0.0;9.1;18.2;27.3;36.4;45.5;54.6;63.7;72.8;81.9;91.0;100.1;109.2;118.3;127.4;136.5;145.6;154.7;163.8;172.9;182.0;191.1;200.2;209.3;218.4;227.5;236.6;245.7;254.8;263.9;273.0;282.1;291.2;300.3;309.4;318.5;327.6;336.7;2000" keyTimes="0.0;0.0263;0.0526;0.0789;0.1053;0.1316;0.1579;0.1842;0.2105;0.2368;0.2632;0.2895;0.3158;0.3421;0.3684;0.3947;0.4211;0.4474;0.4737;0.5;0.5263;0.5526;0.5789;0.6053;0.6316;0.6579;0.6842;0.7105;0.7368;0.7632;0.7895;0.8158;0.8421;0.8684;0.8947;0.9211;0.9474;0.9737;1" calcMode="discrete" begin="0.4s" dur="1.68s" fill="freeze"/>
  </rect></clipPath>
  <text x="200.9" y="74" fill="#C9D1D9" clip-path="url(#f1)" xml:space="preserve">echo "thanks for stopping by" &amp;&amp; exit</text>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.381818181818182s" dur="0.25s" fill="freeze"/><text x="28" y="100" fill="#00FF9C" filter="url(#softglow)">thanks for stopping by</text></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.7818181818181817s" dur="0.25s" fill="freeze"/><text x="28" y="126" fill="#8B949E">logout · [process completed] <tspan fill="#FFBD2E">// go build something</tspan></text><rect class="cursor" x="505.2" y="113" width="9" height="17" fill="#00FF9C"/></g>
    <rect y="38" width="900" height="112" fill="url(#scan)" pointer-events="none"/>
    <rect width="900" height="150" fill="url(#vig)" pointer-events="none"/>
  </g>
  <rect x="0.5" y="0.5" width="899" height="149" rx="12" fill="none" stroke="#30363D"/>
</svg>
