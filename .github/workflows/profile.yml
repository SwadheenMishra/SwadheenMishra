# Regenerates the stats cards + contribution snake for the profile README.
# Runs daily, and can be run by hand from the Actions tab ("Run workflow").
name: Update profile

on:
  schedule:
    - cron: "17 3 * * *"   # every day, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── stats cards (terminal theme) ─────────────────────────────────
      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&custom_title=%24%20git%20stats%20--user%20swadheen&bg_color=0D1117&title_color=00FF9C&text_color=C9D1D9&icon_color=00E5FF&ring_color=00FF9C&border_color=30363D&border_radius=12

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&custom_title=%24%20cat%20languages.log&bg_color=0D1117&title_color=00FF9C&text_color=C9D1D9&border_color=30363D&border_radius=12

      - name: Commit cards
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: refresh profile cards" || exit 0
          git push

      # ── contribution snake (pushed to the `output` branch) ───────────
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#0B8F6A&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39
            dist/snake-dark.svg?palette=github-dark&color_snake=#00FF9C&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Publish snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
